replicaCount: 1

image:
  repository: ghcr.io/voidcommandcenter/starshine-relay
  tag: latest
  pullPolicy: IfNotPresent

starshine:
  server: grpcs://api.void.gs:443
  ledgerId: ""
  existingSecret: starshine-relay-secrets
  walletSecretKey: wallet.json

http:
  host: 0.0.0.0
  port: 8787
  bearerTokenSecretKey: bearer-token

gateway:
  enabled: false
  maxChunkBytes: 8388608
  maxFileBytes: 1073741824
  maxChunks: 10000
  maxJsonBytes: 134217728
  capabilityTtlSeconds: 900
  allowedShardPolicies: "4+2"
  allowedOrigins: ""
  defaultRouteId: void-primary

amqp:
  enabled: false
  existingSecret: starshine-relay-secrets
  urlSecretKey: amqp-url
  queue: ""
  prefetch: 16

outbox:
  storageClass: ""
  size: 10Gi
  encryptionKeySecretKey: outbox-key
  maxAttempts: 20
  retryBaseMs: 1000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi
